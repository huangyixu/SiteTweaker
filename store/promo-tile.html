<!doctype html>
<!-- Chrome 应用商店小型宣传图块（440×280）。重新生成：
     "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" --headless --hide-scrollbars \
       --window-size=440,280 --screenshot=store/promo440.png store/promo-tile.html -->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
    padding: 0 36px; box-sizing: border-box;
    background: linear-gradient(135deg, #6b6bf2, #9b4fe8);
    color: #fff;
    font-family: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  }
  .head { display: flex; align-items: center; gap: 16px; }
  img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25); }
  h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: 1px; }
  .code { font: 600 15px/1 ui-monospace, Menlo, monospace; opacity: 0.85; margin-top: 6px; }
  p { margin: 0; font-size: 17px; line-height: 1.55; opacity: 0.95; }
</style>
</head>
<body>
  <div class="head">
    <img src="logo300.png" alt="" />
    <div>
      <h1>网页定制</h1>
      <div class="code">CSS · JavaScript</div>
    </div>
  </div>
  <p>为任意网站注入你自己的样式和脚本<br />点选隐藏元素 · AI 帮你写规则 · 账号同步</p>
</body>
</html>
