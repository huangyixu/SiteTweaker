<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>网页定制</title>
    <link rel="stylesheet" href="../ui/base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="20" height="20" />
        <strong>网页定制</strong>
      </div>
      <label class="switch-label" title="总开关：关闭后所有规则暂停生效">
        <span id="globalLabel" class="muted">已启用</span>
        <input type="checkbox" id="globalEnabled" class="switch" />
      </label>
    </header>

    <section class="site">
      <div class="site-label muted">当前网站</div>
      <div id="siteHost" class="site-host">—</div>
    </section>

    <section class="tools">
      <button id="pickerBtn" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="7" />
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
          <circle cx="12" cy="12" r="1.5" class="fill" />
        </svg>
        <span>
          <strong>快捷消除</strong>
          <small>点选隐藏网页元素</small>
        </span>
      </button>
      <button id="viewerBtn" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M10 10l-2.5 2.5L10 15M14 10l2.5 2.5L14 15" />
        </svg>
        <span>
          <strong>代码小窗</strong>
          <small>查看本页的 CSS / JS</small>
        </span>
      </button>
    </section>

    <div id="notice" class="notice" hidden>
      <div id="noticeText"></div>
      <button id="noticeBtn" class="btn small" hidden>打开扩展设置</button>
    </div>

    <section id="rulesSection" class="rules">
      <div class="section-title">
        <span>作用于此页面的规则</span>
        <span id="count" class="count"></span>
      </div>
      <ul id="ruleList" class="rule-list"></ul>
      <p id="empty" class="empty muted" hidden>还没有规则作用于此页面</p>
    </section>

    <div id="reloadBar" class="reload-bar" hidden>
      <span>脚本的改动需要刷新页面后生效</span>
      <button id="reloadBtn" class="btn small primary">刷新页面</button>
    </div>

    <footer class="foot">
      <button id="newBtn" class="btn primary">＋ 为此网站新建规则</button>
      <button id="manageBtn" class="btn">管理全部规则</button>
    </footer>

    <script src="../lib/rules.js"></script>
    <script src="../lib/tools.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
